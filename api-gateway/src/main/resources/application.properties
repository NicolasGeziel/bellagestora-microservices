
server.port=8082
spring.application.name=api-gateway

spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:4200
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,PUT,POST,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=Authorization,Content-Type,Accept
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true


spring.cloud.gateway.server.webflux.routes[0].id=auth-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=http://auth-service:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=agendamentos-route
spring.cloud.gateway.server.webflux.routes[1].uri=http://core-service:8080
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/agendamentos/**

spring.cloud.gateway.server.webflux.routes[2].id=procedimentos-route
spring.cloud.gateway.server.webflux.routes[2].uri=http://core-service:8080
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/procedimentos/**


logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.reactive=DEBUG
logging.level.reactor.netty=DEBUG
